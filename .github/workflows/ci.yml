name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: contracts/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npx hardhat test

      - name: Check dashboard ABI drift
        run: npx hardhat run scripts/check-dashboard-abi.ts

  node-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node-client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: node-client/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npx vitest run --pool=forks

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    env:
      NEXT_PUBLIC_RPC_URL: https://rpc.bohr.life
      NEXT_PUBLIC_CHAIN_ID: 968
      NEXT_PUBLIC_SCANNER_URL: https://scan.bohr.life
      NEXT_PUBLIC_TOKEN_ADDRESS: 0x3984FB054C5CdA5926CCB6b9a28518E9Ef9D922b
      NEXT_PUBLIC_VAULT_ADDRESS: 0x689228a6dD03162a66A6D12c8dd2d3A29BFA33E1
      NEXT_PUBLIC_AGGREGATOR_ADDRESS: 0xD8259eeDd2435d9BEF12FF8dd7596F67B95ac640
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npx next build

  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: contracts/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Install slither
        run: pip install slither-analyzer

      - name: Compile
        run: npx hardhat compile

      - name: Slither (non-blocking until baseline tuned)
        run: slither . --fail-none --ignore-compile 2>&1 | tail -n 40 || true
        continue-on-error: true

  ops-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify structure
        run: |
          test -f contracts/contracts/OracleAggregator.sol
          test -f node-client/src/index.ts
          test -f dashboard/app/page.tsx
          test -f docs/node-operator-guide.md
